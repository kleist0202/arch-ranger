# ~/.config/ranger/rc.conf — ładuje się PO domyślnym configu, więc tylko nadpisujemy

# ===== Wygląd =====
set colorscheme nocturne
set column_ratios 1,3,4
set draw_borders both
set dirname_in_tabs true
set show_hidden false
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$
set unicode_ellipsis true
set display_size_in_main_column true
set display_size_in_status_bar true
set display_free_space_in_status_bar true
set line_numbers relative
set one_indexed true
set update_title true
set update_tmux_title true
set padding_right true
set vcs_aware true
set vcs_backend_git enabled
set status_bar_on_top false

# ===== Podgląd =====
set preview_files true
set preview_directories true
set preview_script ~/.config/ranger/scope.sh
set use_preview_script true
set collapse_preview true
# Podgląd obrazków: metodę (iterm2 / kitty / ueberzug / w3m) dobiera
# plugins/image_preview_method.py zależnie od terminala
set preview_images true

# ===== Zachowanie =====
set confirm_on_delete multiple
set automatically_count_files true
set autosave_bookmarks true
set save_backtick_bookmark true
set sort mtime
set sort_directories_first true
set sort_case_insensitive true
set sort_unicode true
set scroll_offset 8
set mouse_enabled true
set cd_tab_case smart
set cd_tab_fuzzy true
set wrap_scroll false
set wrap_plaintext_previews true
set clear_filters_on_dir_change true
set save_tabs_on_exit false

# ===== Skróty =====
# Ukryte pliki
map zh set show_hidden!
# th – to samo co zh (t staje się prefiksem, więc tagowanie przeniesione na tt)
map th toggle_hidden
map tt tag_toggle
map <backspace>  cd ..
map <backspace2> cd ..
map <C-h>       cd ..

# Szybka nawigacja
map gd cd ~/Documents
map gD cd ~/Downloads
map gp cd ~/Pictures
map gc cd ~/.config
map gr cd ~/.config/ranger
map gt cd /tmp

# :z <fragment> – skocz do często używanego katalogu (zoxide)
# dC – policz rozmiar wszystkich katalogów w widoku (dc – tylko zaznaczonych)
map dC du

# fzf (definicje w commands.py)
map <C-f> fzf_select
map <C-g> fzf_grep

# Pliki i katalogi
map mf console touch%space
map md console mkdir%space
map DD shell gio trash %s
map X  shell -f xdg-open %f
# T – nowe okno terminala w bieżącym katalogu (st na Archu, $TERMINAL / x-terminal-emulator gdzie indziej)
map T  shell -f if command -v st >/dev/null; then st; else ${TERMINAL:-x-terminal-emulator}; fi
map ex extract
map ec console compress%space

# Kopiowanie ścieżek do schowka (xclip/wl-copy)
map yp shell -f echo -n %d/%f | (wl-copy 2>/dev/null || xclip -selection clipboard)
map yn shell -f echo -n %f | (wl-copy 2>/dev/null || xclip -selection clipboard)
map yd shell -f echo -n %d | (wl-copy 2>/dev/null || xclip -selection clipboard)

# Taby
map <C-t> tab_new ~
map <C-w> tab_close
map <A-Right> tab_move 1
map <A-Left>  tab_move -1

# Edycja konfiguracji
map ,r chain shell $EDITOR ~/.config/ranger/rc.conf; source ~/.config/ranger/rc.conf
map ,R source ~/.config/ranger/rc.conf


# ===== Tryb dwupanelowy (Double Commander) =====
# ,d    – włącz/wyłącz dwa panele
# Tab   – przełącz panel (domyślne w rangerze)
# F5/F6 – kopiuj/przenieś zaznaczone do drugiego panelu
# F7    – nowy katalog, F8 – do kosza
# =     – drugi panel w tym samym katalogu co bieżący
map ,d    dual
map <F5>  copy_to_other
map <F6>  move_to_other
map <F7>  console mkdir%space
map <F8>  shell gio trash %s
map =     sync_other
# ,s    – zamień panele miejscami
# ,c    – porównaj katalogi: zaznacza pliki, których brakuje po drugiej stronie
#         albo są tam starsze (potem F5 = skopiuj zaznaczone)
map ,s    swap_panes
map ,c    compare_panes

# ===== Dyski wymienne (pasek "⏏ USB" pod tytułem) =====
# LPM na dysku – zamontuj i wejdź, PPM – wysuń
# ,1..,9 – zamontuj i wejdź na dysk nr N, ,e – wysuń dysk, na którym jesteś
map ,1 drive 1
map ,2 drive 2
map ,3 drive 3
map ,4 drive 4
map ,5 drive 5
map ,6 drive 6
map ,7 drive 7
map ,8 drive 8
map ,9 drive 9
map ,e eject

# F9 – zmień sortowanie: nazwa → data → rozmiar → rozszerzenie (w kółko)
#      ranger domyślnie sortuje mtime/size od najnowszych/największych
# Albo komenda :sort nazwa|data|rozmiar|rozszerzenie|typ|losowo [odwrotnie] (Tab podpowiada)
# Pozostałe opcje: o + litera (po samym o pokazuje się lista)
map <F9> sort_cycle

# pp – wklej i ustaw kursor na wklejonym elemencie (jak F5/F6)
map pp paste_select

# Strzałki ←/→: w trybie dual przełączają panel, w zwykłym działają jak zawsze
# (w dual do nawigacji po katalogach zostają h / l / Enter)
map <left>  pane_switch left
map <right> pane_switch right

# q – zamknij ranger od razu, także w dual (domyślnie q zamyka tylko bieżący tab)
# pojedynczy tab zamykasz przez Ctrl+w
map q quitall
